name: 政策金利を更新

on:
  schedule:
    # 毎日 06:20 JST（21:20 UTC）。GitHub側の混雑で数十分ずれることがある
    - cron: "20 21 * * *"
  workflow_dispatch:        # 手動実行ボタン
  push:
    branches: [main]
    paths:
      - "overrides.json"
      - "scripts/fetch_rates.py"

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 取得
        run: python scripts/fetch_rates.py

      - name: 変更があればコミット
        run: |
          if [ -z "$(git status --porcelain data/rates.json)" ]; then
            echo "変更なし"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          git commit -m "政策金利を更新 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
